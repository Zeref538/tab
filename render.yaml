# One-click deploy for the public demo (https://render.com).
#
#   Render dashboard -> New -> Blueprint -> point at this repo.
#
# No secrets, no environment to fill in, nothing to click after. The demo reads
# receipts with an OCR engine rather than a vision model, so there is no API key
# and no GPU anywhere in this file. That is the only reason a free instance can
# run it at all.
#
# Measured before writing this: the OCR route peaks at about 175 MB and holds
# flat over 60 reads, against the free tier's 512 MB. It was NOT flat to begin
# with - it climbed 24 MB a request and would have died here after roughly
# fourteen - see the note in tab/ocr.py about the cycle collector.
#
# What this deploys is a demo, not the product. The product is a thing you run
# on your own machine so your receipts never leave it (ADR 0004). This instance
# reads what you send it in memory and writes nothing down (ADR 0013).
services:
  - type: web
    name: tab-demo
    runtime: python
    plan: free
    region: singapore          # nearest to the receipts this is built for
    # Not `pip install -e`. An editable install links back to the source tree
    # instead of copying files into site-packages, so package data (the demo
    # page and the sample receipts) can resolve differently. tools/check_install.py
    # verifies this exact command in an empty virtualenv, and shipping a command
    # nobody tested is how the last deploy bug got here.
    buildCommand: pip install ".[ocr]"
    startCommand: tab-demo --host 0.0.0.0
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: "3.12"
      # A free instance is one small box. The reader is CPU-bound for about a
      # second per receipt, so this is what stops one script flattening it.
      - key: TAB_RATE_LIMIT_PER_MIN
        value: "20"
      - key: TAB_MAX_UPLOAD
        value: "8388608"       # 8 MB - larger than any photo of a receipt
      # One read at a time. Measured peak memory by concurrent requests before
      # this existed: 1 -> 387 MB, 2 -> 675, 4 -> 1113, 8 -> 1894, against the
      # 512 MB here. Two visitors at once took the box down. The reads were
      # already serialised by the interpreter lock - 1/2/4/8 took
      # 1.0/1.7/3.4/6.5 seconds, dead linear - so nothing was ever gained by
      # running them together. With this, peak is flat at 361 MB at any load.
      - key: TAB_MAX_CONCURRENT
        value: "1"
      # Shrink uploads to this longest edge first. A 3024x4032 phone photo peaks
      # at 606 MB uncapped and 336 MB at 1280px. Re-scored on 100 CORD receipts,
      # the cap costs one total and one subtotal out of a hundred and reads 22%
      # faster. It is set here rather than in the library on purpose: capping
      # inside the reader would change what every published figure means.
      - key: TAB_DEMO_MAX_EDGE
        value: "1280"
