[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
# `tab` is taken on PyPI, `tab-agent` is not — checked, not assumed.
# See docs/adr/0001-name-tab.md. The command stays `tab`.
name = "tab-agent"
version = "0.1.0"
description = "TAB - Tally All Bills. Reads receipts, checks the arithmetic adds up, and only writes a ledger row when it does. Local-first."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "John Andrei Martinez" }]
keywords = ["receipts", "ocr", "agent", "ollama", "local-llm", "bookkeeping", "vat"]

# Deliberately short. Ollama is spoken to over plain urllib, SQLite and hashlib
# are standard library, and a dependency for what five lines of stdlib does is a
# permanent tax on a temporary convenience.
dependencies = [
    "jsonschema>=4.0",
    # One dependency doing three jobs - PDF text layer, page rasterising, image
    # handling - instead of pdfplumber + pdf2image + a poppler binary. Verified
    # on PyPI (name "pymupdf", 1.28.2 current) before it was added.
    #
    # It was missing from this list until the portfolio card was being written,
    # while tab/pdftext.py, tab/pipeline.py and tab/web.py all imported it. It
    # ran here only because it was already installed; a fresh install would
    # have died on the first PDF, which is the main path through the program.
    "pymupdf>=1.24",
    # Only to cap oversized photos before they reach the model. Verified on
    # PyPI (name "pillow", actively released) before it was added.
    "pillow>=10.0",
]

[project.optional-dependencies]
# Added when the slice that needs them lands, not before.
dev = ["pytest>=8.0", "ruff>=0.4"]

[project.scripts]
tab = "tab.cli:main"

[tool.setuptools]
packages = ["tab"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
